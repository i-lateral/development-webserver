[xdebug]
; Note: Remove the comment ; to enable debugging
; Currently this is done per request
zend_extension=xdebug
;zend_extension=/usr/local/lib/php/extensions/no-debug-non-zts-20220829/xdebug.so
;xdebug.mode=develop,debug,profile
xdebug.mode=develop,debug
xdebug.start_with_request=yes
xdebug.idekey=VSCODE
#xdebug.log=/tmp/xdebug.log

; Client Config
;xdebug.client_host=localhost
#xdebug.client_host=host.docker.internal
xdebug.client_host=172.158.0.1
xdebug.client_port=9090
xdebug.discover_client_host=true

; Log to terminal
xdebug.log=/dev/stdout
xdebug.log_level=0

; Debug settings
xdebug.var_display_max_depth=-1
xdebug.var_display_max_children=-1
xdebug.var_display_max_data=-1
